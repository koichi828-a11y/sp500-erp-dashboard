name: Deploy ERP Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 毎日 日本時間 午前9:00 (UTC 0:00) に自動実行してデータを最新化
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動で即座にデータ更新・再ビルドするボタンを有効化

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Build data and assets 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
